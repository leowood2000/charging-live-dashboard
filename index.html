<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K80 Pro 无线充电实时仪表盘（MCA 深度档案）</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel-2: #16213a;
    --border: #22304d;
    --text: #e6edf7;
    --muted: #8fa3bf;
    --green: #34d399;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; }
  html {
    background: var(--bg);
  }
  html, body {
    width: 100%;
    min-height: 100%;
    overflow-y: auto;
    touch-action: pan-y;
  }
  body {
    width: auto;
    max-width: 1320px;
    margin: 0 auto;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 18px 24px 44px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 12px; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 13px; font-size: 13px; background: var(--panel);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.loading { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 500; }

  .banner {
    display: none;
    border: 1px solid rgba(248,113,113,.45);
    background: rgba(248,113,113,.08);
    color: #fecaca;
    padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  .banner.show { display: block; }

  .section-title {
    display: flex; align-items: center; gap: 10px;
    margin: 26px 0 12px; font-size: 15px; font-weight: 600; color: var(--cyan);
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .section-title .badge {
    font-size: 11px; font-weight: 400; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .kpi {
    background: linear-gradient(160deg, rgba(34,211,238,.12), rgba(34,211,238,.02));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; min-height: 92px;
  }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .kpi .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .unit { font-size: 13px; color: var(--muted); margin-left: 3px; font-weight: 400; }
  .kpi .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-flow: row;
    align-items: stretch;
    gap: 12px; margin-bottom: 16px;
  }
  .grid > .card {
    min-width: 0;
    height: 100%;
    align-self: stretch;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 14px; font-weight: 500;
    color: var(--cyan); display: flex; align-items: center; gap: 8px;
  }
  .card h2 .tag {
    font-size: 11px; color: var(--muted); font-weight: 400;
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px;
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13px; }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v {
    text-align: right; font-variant-numeric: tabular-nums;
    word-break: break-all; white-space: pre-wrap;
  }
  .kv .v.bad { color: var(--red); }
  .kv .v small { color: var(--muted); margin-left: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tiles.batt { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card.wide { grid-column: 1 / -1; }
  .card.wide .tiles.batt { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card.wide .tiles.batt .tile.wide { grid-column: span 2; }
  .tile {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; min-width: 0;
  }
  .tile .k { font-size: 11px; color: var(--muted); margin-bottom: 5px; word-break: break-all; }
  .tile .k small { display: block; margin-top: 2px; }
  .tile .v {
    font-size: 15px; font-weight: 600; word-break: break-all;
    font-variant-numeric: tabular-nums; line-height: 1.4;
  }
  .tile .v small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .tile .v .empty { color: var(--muted); font-weight: 400; }
  .tile .v .chips { justify-content: flex-start; }
  .tile.wide { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 9px; font-size: 12px;
  }
  .chip b { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip small { color: var(--muted); margin-left: 3px; }

  .charts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  #liveSessions { grid-template-columns: 1fr; }
  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .chart-card h3 {
    margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .chart-card h3 span { color: var(--text); font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 120px; display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.time { color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mono { font-family: Consolas, "Courier New", monospace; font-size: 11px; color: #b9c7dd; word-break: break-all; }
  .flow {
    display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px;
    font-size: 12px;
  }
  .flow .step {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; min-width: 84px; text-align: center; line-height: 1.35;
  }
  .flow .step b { display: block; font-weight: 600; color: var(--text); font-size: 12px; }
  .flow .step small { color: var(--muted); }
  .flow .arrow { align-self: center; color: var(--cyan); font-weight: 700; }
  .chain {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px;
  }
  .chain .node {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    background: var(--panel-2); text-align: center; flex: 1 1 110px;
  }
  .chain .node b { display: block; font-size: 12px; }
  .chain .node small { color: var(--muted); }
  .chain .arrow { color: var(--cyan); font-weight: 700; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 6px 0 0; }
  .note b { color: var(--text); font-weight: 500; }

  details {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
  }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre {
    background: #0a101c; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow: auto; font-size: 11px; line-height: 1.5;
    max-height: 340px; color: #b9c7dd; white-space: pre-wrap; word-break: break-all;
  }
  .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .mod-grid h4 { margin: 0 0 5px; font-size: 12px; color: var(--amber); font-weight: 500; }
  .mod-grid ul { margin: 0; padding-left: 16px; font-size: 11px; color: #b9c7dd; line-height: 1.7; }
  .vote-block {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 10px; background: var(--panel-2);
  }
  .vote-block:last-child { margin-bottom: 0; }
  .vote-head {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between;
    font-size: 12px; margin-bottom: 6px;
  }
  .vote-head b { color: var(--cyan); }
  .vote-head small { color: var(--muted); }
  .vote-head .vote-result {
    color: var(--cyan);
    border: 1px solid rgba(34,211,238,.35);
    background: rgba(34,211,238,.08);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12px;
  }
  .vote-head .vote-result b { color: var(--text); }
  .vote-head .vote-result.calc {
    color: var(--amber);
    border-color: rgba(251,191,36,.45);
    background: rgba(251,191,36,.08);
  }
  .vote-head .vote-result.calc b { color: var(--amber); }
  .vote-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .vote-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 11px; font-size: 12px;
  }
  .vote-chip .vc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .vote-chip b { font-weight: 600; color: var(--muted); }
  .vote-chip i { font-style: normal; font-variant-numeric: tabular-nums; color: var(--text); }
  .vote-chip small { color: var(--muted); }
  .vote-chip.on { border-color: rgba(52,211,153,.55); }
  .vote-chip.on .vc-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .vote-chip.on b { color: var(--text); }
  .vote-chip.changed { border-color: rgba(251,191,36,.7); background: rgba(251,191,36,.08); }
  .vote-chip.changed b { color: var(--amber); }
  .vote-all { margin-top: 8px; }
  .vote-all summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .vote-all .vote-chips { margin-top: 6px; }

  @keyframes flashbg {
    0% { background-color: rgba(52,211,153,.22); }
    100% { background-color: transparent; }
  }
  .flash { animation: flashbg .8s ease-out; border-radius: 6px; }
  .empty { color: var(--muted); }

  @media (max-width: 900px) {
    body { padding: 14px 14px 36px; }
    .kpis,
    #groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #voteTopics,
    #liveSessions,
    .charts { grid-template-columns: 1fr; }
    .card.wide .tiles.batt {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .card.wide .tiles.batt .tile.wide {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 560px) {
    body { padding: 12px 10px 36px; }
    .tiles,
    .tiles.batt { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { padding: 12px 10px; }
    table { display: block; overflow-x: auto; }
    canvas { height: 100px; }
  }

  @media (max-width: 320px) {
    .kpis,
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>K80 Pro 无线充电实时仪表盘</h1>
      <div class="sub">Redmi K80 Pro · HyperOS · ADB Root 实时监控</div>
    </div>
    <span class="status" id="statusBadge"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></span>
    <div class="spacer"></div>
    <div class="meta">
      设备：<b id="metaDevice">-</b> ｜ 采样：<b id="metaInterval">3</b>s ｜
      最后更新：<b id="lastUpdate">-</b> ｜ 版本：<b id="metaVersion">-</b> ｜
      实时刷新：<b id="fastCountdown">-</b> ｜ 日志刷新：<b id="logsCountdown">-</b>
    </div>
  </header>

  <div class="banner" id="offlineBanner"></div>

  <div class="section-title">实时数据 <span class="badge">每 3 秒刷新</span></div>
  <section class="kpis" id="kpis" aria-label="关键指标"></section>
  <section class="grid" id="groups" aria-label="充电实时数据"></section>
  <section class="charts" id="charts" aria-label="实时曲线">
    <div class="chart-card">
      <h3>输入功率 (W) <span id="chart-input-power">-</span>
        <small id="chart-input-source" class="badge"></small></h3>
      <canvas id="cv-input-power" role="img" aria-label="输入功率曲线"></canvas>
    </div>
    <div class="chart-card">
      <h3>电池电流 (mA) <span id="chart-batt-current">-</span></h3>
      <canvas id="cv-batt-current" role="img" aria-label="电池电流曲线"></canvas>
    </div>
    <div class="chart-card">
      <h3>输入电压 (V) <span id="chart-vout">-</span></h3>
      <canvas id="cv-vout" role="img" aria-label="输入电压曲线"></canvas>
    </div>
    <div class="chart-card">
      <h3>输入电流 (mA) <span id="chart-iout">-</span></h3>
      <canvas id="cv-iout" role="img" aria-label="输入电流曲线"></canvas>
    </div>
  </section>

  <div class="section-title">电流投票实时表 <span class="badge">生效主题 · 10 秒刷新</span>
    <span id="voteLogsAge" class="badge" style="display:none"></span>
    <span id="logsStaleBadge" class="badge" style="display:none;color:var(--amber);border-color:rgba(251,191,36,.5)">日志读取失败 · 显示上次成功数据</span>
  </div>
  <section class="grid" id="voteTopics" aria-label="电流投票实时表"></section>

  <div class="section-title">实时会话档案 <span class="badge">mca_log 最近会话 · 10 秒刷新</span></div>
  <section class="grid" id="liveSessions" aria-label="实时会话档案"></section>

  <details id="rawDetails">
    <summary>原始数据 JSON（所有节点完整输出）</summary>
    <pre id="rawJson">等待数据…</pre>
  </details>

<script>
"use strict";

const CHIP_FACTS = [
  ["无线接收芯片", "SC96281（南芯）"],
  ["电量计", "bq27z561_master"],
  ["主电荷泵", "sc8585_master"],
  ["从电荷泵", "sc8585_slave（未启用）"],
  ["快充管理", "小米澎湃 P3 + G1"],
  ["充电框架", "MCA · mca_common / mca_vote"],
  ["HAL 服务", "vendor.xiaomi.hardware.micharge"],
  ["SmartEndura", "batteryantiaging 服务"],
  ["FOD 节点", "SC96281 / NU1652 双参数表"],
  ["电池", "O11U_6000mah_120w 单电芯"],
  ["电芯接口", "主/从双 BTB"],
  ["系统", "HyperOS · KernelSU root"],
];

/* ================= 实时渲染逻辑 ================= */
const DEFAULT_POLL_MS = 3000;
let pollMs = DEFAULT_POLL_MS;
let lastFetchAt = 0;
let timer = null;
const lastValues = {};
let lastGroupsJson = "";
let lastVotersJson = "";
let lastSessionsJson = "";
let lastGroupsStruct = "";

const KPI = [
  { id: "input_power_w", label: "输入功率", unit: "W", digits: 2, hint: "当前输入 VBUS × IBUS（有线/无线自动切换）" },
  { id: "battery_power_w", label: "电池功率", unit: "W", digits: 2, hint: "正值为充电，负值为放电" },
  { id: "batt_current_ma", label: "电池电流", unit: "mA", digits: 0, hint: "充电为正，放电为负" },
  { id: "batt_voltage_mv", label: "电池电压", unit: "mV", digits: 0, hint: "单电芯实测电压" },
  { id: "capacity", label: "电量 SOC", unit: "%", digits: 1, hint: "battery uevent" },
  { id: "temp_c", label: "电池温度", unit: "°C", digits: 1, hint: "battery uevent" },
];

const BATTERY_FIELDS = [
  ["current_now", "CURRENT_NOW", v => (v / 1000).toFixed(1), "mA", "µA → mA", "电流"],
  ["voltage_now", "VOLTAGE_NOW", v => (v / 1000).toFixed(1), "mV", "µV → mV", "电压"],
  ["capacity", "CAPACITY", v => v, "%", "", "电量"],
  ["temp", "TEMP", v => (v / 10).toFixed(1), "°C", "0.1°C → °C", "温度"],
  ["status", "STATUS", v => v, "", "", "状态"],
  ["health", "HEALTH", v => v, "", "", "健康"],
  ["input_current_limit", "INPUT_CURRENT_LIMIT", v => (v / 1000).toFixed(0), "mA", "µA → mA", "输入电流上限"],
  ["cycle_count", "CYCLE_COUNT", v => v, "次", "", "循环次数"],
  ["charge_full", "CHARGE_FULL", v => (v / 1000).toFixed(0), "mAh", "µAh → mAh", "满充容量"],
  ["charge_counter", "CHARGE_COUNTER", v => (v / 1000).toFixed(0), "mAh", "µAh → mAh", "累计充电"],
  ["time_to_full_now", "TIME_TO_FULL_NOW", v => v > 0 ? Math.ceil(v / 60) : v, "min", "秒 → 分钟", "预计充满剩余"],
  ["voltage_max_design", "VOLTAGE_MAX_DESIGN", v => (v / 1000).toFixed(3), "V", "µV → V", "设计电压上限"],
  ["technology", "TECHNOLOGY", v => v, "", "", "电池类型", true],
  ["model_name", "MODEL_NAME", v => v, "", "", "电池型号", true],
  ["present", "PRESENT", v => v, "", "", "电池在位"],
  ["capacity_level", "CAPACITY_LEVEL", v => v, "", "", "电量等级"],
];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmt(v, digits = 0) {
  if (v === null || v === undefined || Number.isNaN(v)) return "--";
  return Number(v).toLocaleString("zh-CN", { maximumFractionDigits: digits, minimumFractionDigits: 0 });
}
function srcText(s) {
  if (s === "quick_charge_regulation") return "quickchg regulation";
  if (s === "buckchg_telemetry") return "buckchg telemetry";
  if (s === "usb_uevent") return "USB uevent";
  if (s === "cp_ibus_total") return "CP ibus_total";
  return s || "-";
}
function inputSourceHint(d) {
  const s = d.input_source;
  if (s === "wired") return "有线 VBUS × IBUS · " + srcText(d.wired_input_source);
  if (s === "wireless") return "无线 vout × iout（wls_debug）";
  return "未连接充电输入";
}
function flash(id, value) {
  const el = $(id);
  if (!el) return;
  if (lastValues[id] !== undefined && lastValues[id] !== value) {
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }
  lastValues[id] = value;
}

function setStatus(mode, text) {
  $("statusDot").className = "dot " + (mode === "live" ? "live" : mode === "loading" ? "loading" : "offline");
  $("statusText").textContent = text;
}

/* ---------- 实时渲染 ---------- */
function renderOffline(data) {
  setStatus("offline", "设备离线");
  const banner = $("offlineBanner");
  banner.classList.add("show");
  banner.textContent = "采集失败：" + (data.error || "未知错误") +
    "。当前不显示任何伪造数据，请确认 server.py 正在运行并且 ADB 设备在线。";
  $("metaDevice").textContent = data.meta && data.meta.adb ? data.meta.adb : "-";
  $("metaInterval").textContent = data.meta ? data.meta.interval : "3";
  $("metaVersion").textContent = (data.meta && data.meta.version) || "-";
  $("lastUpdate").textContent = data.iso || "-";

  $("kpis").innerHTML = KPI.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div><div class="value empty">--</div></div>`).join("");
  $("groups").innerHTML = "";
  lastGroupsStruct = "";
  $("voteTopics").innerHTML = `<div class="card"><h2>电流投票实时表<span class="tag">离线</span></h2>` +
    `<p class="note">设备离线，暂无投票数据。</p></div>`;
  $("liveSessions").innerHTML = `<div class="card"><h2>实时会话档案<span class="tag">离线</span></h2>` +
    `<p class="note">设备离线，暂无会话数据。</p></div>`;
  ["chart-input-power", "chart-batt-current", "chart-vout", "chart-iout"]
    .forEach(id => $(id).textContent = "-");
  ["cv-input-power", "cv-batt-current", "cv-vout", "cv-iout"]
    .forEach(id => clearCanvas($(id)));
  $("rawJson").textContent = JSON.stringify(data, null, 2);
}

function renderKpis(d) {
  const html = KPI.map(k => {
    const v = d[k.id];
    const has = v !== null && v !== undefined && !Number.isNaN(v);
    const hint = k.id === "input_power_w" ? inputSourceHint(d) : k.hint;
    return `<div class="kpi"><div class="label">${k.label}</div>` +
      `<div class="value" id="kpi-${k.id}">${has ? fmt(v, k.digits) : "--"}</div>` +
      `<span class="unit">${has ? k.unit : ""}</span>` +
      `<div class="hint">${hint}</div></div>`;
  }).join("");
  $("kpis").innerHTML = html;
  KPI.forEach(k => flash("kpi-" + k.id, d[k.id]));
}

function renderNodeBody(node) {
  let body = `<span class="empty">不可读</span>`;
  if (node.ok && node.value) {
    if (node.fmt === "wls") {
      const m = {};
      String(node.value).replace(/([A-Za-z_]+)=(-?\d+(?:\.\d+)?)/g, (_, k, v) => { m[k] = +v; return ""; });
      const chips = [];
      if (m.vout !== undefined) chips.push(`<span class="chip">vout<b>${m.vout}</b><small>mV</small></span>`);
      if (m.vrect !== undefined) chips.push(`<span class="chip">vrect<b>${m.vrect}</b><small>mV</small></span>`);
      if (m.iout !== undefined) chips.push(`<span class="chip">iout<b>${m.iout}</b><small>mA</small></span>`);
      if (m.tx_adapter !== undefined) chips.push(`<span class="chip">TX<b>${m.tx_adapter}</b></span>`);
      body = `<div class="chips">${chips.join("")}</div>`;
    } else if (node.fmt === "epp") {
      const on = node.value === "1";
      body = `<span class="${on ? "" : "bad"}">${on ? "已建立（EPP 协商成功）" : "未建立（仅 BPP）"}</span>`;
    } else if (node.fmt === "ichg") {
      body = `<span>${esc(node.value)}</span>`;
    } else if (node.fmt === "ua_to_ma") {
      const n = Number(node.value);
      body = Number.isFinite(n)
        ? `<span title="原始值 ${esc(node.value)} µA（策略上限，非实时测量）">${fmt(n / 1000, 0)}<small>${node.unit || "mA"}</small></span>`
        : `<span class="bad">${esc(node.value)}</span>`;
    } else if (node.fmt === "num") {
      const n = Number(node.value);
      body = `<span class="${Number.isFinite(n) ? "" : "bad"}">${esc(node.value)}<small>${node.unit}</small></span>`;
    } else {
      body = `<span>${esc(node.value)}</span>`;
    }
  }
  return body;
}

function renderNode(node) {
  const wide = node.fmt === "wls" || node.fmt === "ichg" ? " wide" : "";
  return `<div class="tile${wide}"><div class="k">${esc(node.label)}</div>` +
    `<div class="v" data-node="${node.id}">${renderNodeBody(node)}</div></div>`;
}

function renderGroups(d) {
  // 结构签名：分组/节点/电池字段是否变化；值变化不走这里（增量更新）
  const struct = JSON.stringify({
    groups: d.nodes.map(n => [n.group, n.id, n.fmt, n.label]),
    batt: BATTERY_FIELDS.map(f => f[0]),
    src: d.derived && d.derived.input_source,
    wiredOnline: !!(d.derived && d.derived.wired_online),
  });
  if (struct !== lastGroupsStruct) {
    lastGroupsStruct = struct;
    buildGroups(d);
  } else {
    // 增量更新：只替换数值，不重建 DOM
    d.nodes.forEach(n => {
      const el = document.querySelector(`[data-node="${n.id}"]`);
      if (el) el.innerHTML = renderNodeBody(n);
    });
    BATTERY_FIELDS.forEach(([key]) => {
      const el = document.querySelector(`[data-batt="${key}"]`);
      if (!el) return;
      const item = d.battery[key] || d.battery[key.toUpperCase()];
      const has = item && item.ok && item.value !== "";
      let v = `<span class="empty">不可读</span>`;
      if (has) {
        const shown = getBatteryShownValue(d, key, item);
        v = `<span>${esc(shown)}<small>${batteryUnit(key)}</small></span>`;
      }
      el.innerHTML = v;
    });
    ["vbus", "ibus", "power", "src", "tel"].forEach(key => {
      const el = document.querySelector(`[data-wired="${key}"]`);
      if (el) el.innerHTML = key === "tel" ? wiredTelValue(d) : wiredTileValue(key, d);
    });
    const tagEl = $("wiredInputTag");
    if (tagEl) {
      const tel = (d && d.derived) || {};
      const staleTip = tel.wired_input_stale ? "（数据暂时陈旧）" : "";
      const waitTip = tel.wired_input_waiting ? " · 等待策略遥测" : "";
      const ageTip = tel.wired_input_source
        && tel.wired_input_source !== "usb_uevent"
        && tel.wired_input_age !== null && tel.wired_input_age !== undefined
        ? ` · ${tel.wired_input_age}s前` : "";
      tagEl.textContent = `${srcText(tel.wired_input_source)}${waitTip}${ageTip}${staleTip}`;
    }
  }
}

function wiredTileValue(key, d) {
  const tel = (d && d.derived) || {};
  if (key === "src") {
    return `<span>${esc(srcText(tel.wired_input_source))}</span>`;
  }
  const v = key === "vbus" ? tel.wired_vbus_mv
    : key === "ibus" ? tel.wired_ibus_ma
    : tel.wired_input_power_w;
  if (v === null || v === undefined) return `<span class="empty">--</span>`;
  if (key === "vbus") return `<span>${fmt(v / 1000, 2)}<small>V</small></span>`;
  if (key === "ibus") return `<span>${fmt(v, 0)}<small>mA</small></span>`;
  return `<span>${fmt(v, 2)}<small>W</small></span>`;
}

function wiredTelValue(d) {
  const tel = (d && d.derived) || {};
  const ti = tel.wired_tel_ibus_ma;
  if (!Number.isFinite(ti)) return `<span class="empty">--</span>`;
  return `${fmt(ti, 0)}<small>mA</small>` +
    (tel.wired_tel_stale ? '<span class="bad" style="margin-left:4px">陈旧</span>' : "");
}

function batteryConv(key, raw) {
  const f = BATTERY_FIELDS.find(x => x[0] === key);
  if (f) return f[2](raw);
  return raw;
}

function batteryUnit(key) {
  const f = BATTERY_FIELDS.find(x => x[0] === key);
  return f ? f[3] : "";
}

function getBatteryShownValue(d, key, item) {
  // 电池标准属性里的 current_now 也使用归一化符号（充电为正、放电为负），
  // 与顶部 KPI 保持一致；原始 JSON 仍保留内核原值方便排查。
  if (
    key === "current_now" &&
    d.derived &&
    Number.isFinite(Number(d.derived.batt_current_ma))
  ) {
    return Number(d.derived.batt_current_ma).toFixed(1);
  }
  const num = Number(item.value);
  return Number.isFinite(num)
    ? batteryConv(key, item.value)
    : item.value;
}

function buildGroups(d) {
  // 非无线输入时隐藏“无线策略实时”整组（vout/vrect/iout/EPP 等无线语义节点）
  const src = d.derived && d.derived.input_source;
  const wiredNow = src === "wired" || !!(d.derived && d.derived.wired_online);
  const visibleNodes = src === "wireless"
    ? d.nodes
    : d.nodes.filter(n => n.group !== "无线策略实时");
  const groups = {};
  visibleNodes.forEach(n => { (groups[n.group] ||= []).push(n); });
  const cards = Object.entries(groups).map(([name, nodes]) => {
    const tiles = nodes.map(renderNode).join("");
    const extra = name === "芯片与系统"
      ? CHIP_FACTS.map(f =>
          `<div class="tile"><div class="k">${esc(f[0])}</div><div class="v">${esc(f[1])}</div></div>`).join("")
      : "";
    return `<div class="card${name === "芯片与系统" ? " wide" : ""}"><h2>${esc(name)}<span class="tag">${nodes.length} 项</span></h2>` +
      `<div class="tiles">${tiles}${extra}</div></div>`;
  });

  // 有线输入实时卡：VBUS/IBUS/输入功率 + 测量来源，来源按功率路径切换
  if (wiredNow) {
    const tel = d.derived || {};
    const staleTip = tel.wired_input_stale ? "（数据暂时陈旧）" : "";
    const waitTip = tel.wired_input_waiting ? " · 等待策略遥测" : "";
    const ageTip = tel.wired_input_source
      && tel.wired_input_source !== "usb_uevent"
      && tel.wired_input_age !== null && tel.wired_input_age !== undefined
      ? ` · ${tel.wired_input_age}s前` : "";
    cards.unshift(`<div class="card"><h2>有线输入实时<span class="tag" id="wiredInputTag">${esc(srcText(tel.wired_input_source))}${waitTip}${ageTip}${staleTip}</span></h2>` +
      `<div class="tiles"><div class="tile"><div class="k">有线输入电压<small>VBUS</small></div><div class="v" data-wired="vbus">${wiredTileValue("vbus", d)}</div></div>` +
      `<div class="tile"><div class="k">有线输入电流<small>IBUS</small></div><div class="v" data-wired="ibus">${wiredTileValue("ibus", d)}</div></div>` +
      `<div class="tile"><div class="k">有线输入功率<small>VBUS×IBUS</small></div><div class="v" data-wired="power">${wiredTileValue("power", d)}</div></div>` +
      `<div class="tile wide"><div class="k">遥测校验<small>策略日志 ibus · ${esc(tel.wired_tel_source ? srcText(tel.wired_tel_source) : "-")}</small></div><div class="v" data-wired="tel">${wiredTelValue(d)}</div></div>` +
      `<div class="tile wide"><div class="k">测量来源<small>wired_input_source</small></div><div class="v" data-wired="src">${wiredTileValue("src", d)}</div></div></div></div>`);
  }

  const battRows = BATTERY_FIELDS.map(([key, ukey, conv, unit, hint, label, wide]) => {
    const item = d.battery[key] || d.battery[ukey.toLowerCase()];
    const has = item && item.ok && item.value !== "";
    let v = `<span class="empty">不可读</span>`;
    if (has) {
      const shown = getBatteryShownValue(d, key, item);
      v = `<span>${esc(shown)}<small>${unit}</small></span>`;
    }
    return `<div class="tile${wide ? " wide" : ""}"><div class="k">${label}${hint ? `<small>${hint} · ${ukey}</small>` : `<small>${ukey}</small>`}</div>` +
      `<div class="v" data-batt="${key}">${v}</div></div>`;
  }).join("");
  cards.push(`<div class="card wide"><h2>电池标准属性<span class="tag">battery uevent</span></h2>` +
    `<div class="tiles batt">${battRows}</div></div>`);
  $("groups").innerHTML = cards.join("");
}

function renderVoters(d) {
  const el = $("voteTopics");
  const topics = d.voters || {};
  const keys = Object.keys(topics);
  if (!keys.length) {
    el.innerHTML = `<div class="card"><h2>电流投票实时表<span class="tag">最近日志</span></h2>` +
      `<p class="note">日志中暂无投票表输出。</p></div>`;
    return;
  }
  // auth_20w/30w/50w/80w/voice_box/magnet 是按充电板型号预置的热控表，
  // 无论连接哪台垫都会被热控客户端投票，不属于“当前设备”的仲裁结果，直接隐藏
  const isDeviceModelTable = t => /^wireless_auth_/.test(t);
  // BPP/BPPQC2/BPPQC3/EPP 协议表同理：mca_wireless_thermal 会整批投票，不随实际模式变化
  const isProtocolTable = t => /^wireless_(bpp|epp)/.test(t);
  // JEITA 终止电压/电流是温度档决定的静态参数，合并成一张卡展示，不占多张卡
  const isStaticParam = t => t === "term_volt" || t === "term_curr";
  // 有线档位参数表（5V/9V）与 CP 分压表：预置表，不是当前路径的生效值
  const WIRED_PRESET_TOPICS = new Set([
    "buck_5v_in", "buck_9v_in", "buck_5v_ich", "buck_9v_ich",
  ]);
  const WIRED_CP_TOPICS = new Set([
    "div1_single", "div1_multi", "div2_single", "div2_multi",
    "div4_single", "div4_multi", "single_chg_cur", "multi_chg_cur", "thermal_flip",
  ]);
  // 当前输入源：wired / wireless / none（由后端按功率路径选择，vrect 仅兼容旧接口兜底）
  const inputSrc = d.derived && d.derived.input_source;
  const wirelessActive = inputSrc
    ? inputSrc === "wireless"
    : !!(d.derived && d.derived.vrect > 0);
  // 是否真正在充电：以 battery STATUS 为准（缺失时保守显示）
  const battSt = (d.battery && d.battery.status && d.battery.status.value || "").toLowerCase();
  const chargingNow = battSt === "" ? true : battSt === "charging";
  const wirelessCharging = chargingNow && wirelessActive;
  const wiredCharging = chargingNow && (
    inputSrc === "wired" || !!(d.derived && d.derived.wired_online));
  // 日志数据年龄：投票/仲裁来自 10 秒日志周期，可能与 3 秒实时 KPI 短暂不一致
  const logsAge = d.meta && d.meta.logs_updated_at
    ? Math.max(0, Math.round((Date.now() - d.meta.logs_updated_at) / 1000)) : null;
  const ageEl = $("voteLogsAge");
  if (ageEl) {
    if (logsAge !== null && logsAge > 5) {
      ageEl.style.display = "";
      ageEl.textContent = `投票数据 ${logsAge}s 前`;
    } else {
      ageEl.style.display = "none";
    }
  }
  // 只显示与当前连接/状态相关的投票主题：有启用票，或驱动已给出实际投票结果
  const relevant = keys.filter(t => {
    if (isDeviceModelTable(t) || isProtocolTable(t) || isStaticParam(t)) return false;
    if (t === "quick_chg_disable" && wirelessActive) return false;      // 无线充电时隐藏有线快充禁用
    if (t === "wls_quick_chg_disable" && !wirelessActive) return false; // 非无线时隐藏无线快充禁用
    if (wiredCharging) {
      const wcp = (d.derived && d.derived.wired_cp) || {};
      // 5V/9V 档位参数表：两档同时挂着，不是当前生效值，真正输入限流由 buck_input 表达
      if (WIRED_PRESET_TOPICS.has(t)) return false;
      // 无线相关表有线时无效
      if (t.startsWith("wireless_")) return false;
      if (wcp.state === "cp") {
        // 有线 CP 激活：只保留对应比例的 div 卡 + single/multi/thermal_flip
        if (WIRED_CP_TOPICS.has(t)) {
          if (t.startsWith("div")) {
            const want = "div" + (wcp.ratio || "");
            if (!t.startsWith(want)) return false;
          }
          return true;
        }
        // CP 路径下隐藏 buck 输入/FCC 卡
        if (t === "buck_input" || t === "buck_charge_curr") return false;
      } else {
        // Buck 或未知：隐藏全部 CP 分压表
        if (WIRED_CP_TOPICS.has(t)) return false;
      }
    }
    const b = topics[t];
    const hasEnabled = (b.rows || []).some(r => r.enable === 1);
    return hasEnabled
        || (b.result && b.result.client && b.result.client !== "(null)" && !(b.rows && b.rows.length));
  });
  const jeitaVolt = topics.term_volt;
  const jeitaCurr = topics.term_curr;
  const hasJeita = (jeitaVolt || jeitaCurr) && [jeitaVolt, jeitaCurr].some(b =>
    b && ((b.rows || []).some(r => r.enable === 1)
        || (b.result && b.result.client && b.result.client !== "(null)")));
  if (!relevant.length && !hasJeita) {
    el.innerHTML = `<div class="card"><h2>电流投票实时表<span class="tag">生效主题</span></h2>` +
      `<p class="note">当前无生效的投票主题（无线/有线未连接或全部票已撤）。</p></div>`;
    return;
  }

  // 结果是否仍有效：拔电/撤票后（该主题无启用票）旧 effective 行不再展示
  const resultValid = b => !!b.result
    && (!(b.rows && b.rows.length) || (b.rows || []).some(r => r.enable === 1));

  const chipHtml = b => (b.rows || []).map(r => {
    const changed = b.changed && b.changed.client === r.client;
    const cls = `vote-chip ${r.enable ? "on" : "off"}${changed ? " changed" : ""}`;
    const unit = b.unit || "";
    return `<span class="${cls}" title="${esc(r.client)}：生效=${r.enable}，值=${r.value}${unit}">` +
      `<span class="vc-dot"></span><b>${esc(r.client)}</b><i>${r.value}</i>` +
      `${unit ? `<small>${unit}</small>` : ""}</span>`;
  }).join("");

  const effectiveOf = b => {
    if (!b) return null;
    // MCA 驱动 effective vote is now 是唯一首选仲裁结果
    if (resultValid(b)) return { client: b.result.client, value: b.result.value, calc: false };
    // 只有已核实为 MIN/MAX 的 votable 才允许按投票表推算
    if ((b.policy === "MIN" || b.policy === "MAX") && b.unit === "mA") {
      const enabled = (b.rows || []).filter(r => r.enable === 1);
      if (enabled.length) {
        const pick = enabled.reduce((a, r) =>
          b.policy === "MAX" ? (r.value > a.value ? r : a) : (r.value < a.value ? r : a));
        return { client: pick.client, value: pick.value, calc: true };
      }
    }
    return null;
  };
  const summary = [];
  const addSummary = (label, eff, fmt) => {
    if (!eff) return;
    const srcTip = eff.calc
      ? "驱动未输出 effective 行，按已核实 policy 推算"
      : "驱动 effective vote is now 仲裁结果";
    summary.push(`<span class="chip" title="${srcTip}">` +
      `${label}<b>${fmt(eff.value)}</b><small>${esc(eff.client)}${eff.calc ? " · 推算" : ""}</small></span>`);
  };
  const buck = topics.wireless_buck_input;
  const mcaEff = effectiveOf(buck);
  if (chargingNow && wirelessActive) {
    const ratio = buck && buck.cp_ratio
      ? (buck.cp_ratio === 1 ? "1:1（bypass）"
          : buck.cp_ratio === 2 ? "2:1（div2）"
          : buck.cp_ratio === 4 ? "4:1（div4）"
          : buck.cp_ratio + ":1")
      : "";
    const cpState = buck && buck.cp_state;
    let pathLabel;
    if (cpState === "cp") {
      pathLabel = `电荷泵（Quick Wireless）${ratio ? " · " + ratio : ""}`;
    } else if (cpState === "buck") {
      pathLabel = "Buck 直充（无线）";
    } else {
      pathLabel = "Buck / CP 未激活（待确认）";
    }
    const ppStaleW = d.meta && d.meta.power_path_logs_stale;
    const staleW = ppStaleW
      ? (cpState === "unknown" ? " · 路径日志读取异常" : " · 数据暂时陈旧") : "";
    summary.push(`<span class="chip" title="由电荷泵 operation mode/work_mode 判定（内核日志符号 sc8581，OSS 设备树节点 SC8585）${ppStaleW ? " · 路径日志读取异常，显示上次成功状态" : ""}">当前功率路径<b>${esc(pathLabel)}</b><small>${staleW}</small></span>`);
  }
  const ioutNow = d.derived && d.derived.iout !== null && d.derived.iout !== undefined
    ? d.derived.iout : null;
  // BPP drawload 阶段 iwls 与 iout 同域，直接比较实际 RX 输出电流与 ICL；
  // Vrect/Vbat 折算只适用于“输入侧 ICL → 电池侧 Ibat”的功率守恒比较，不用于此处
  const iclNotEffective = (icl, iout) => {
    if (icl === null || icl === undefined || iout === null || iout === undefined) return false;
    return iout > icl * 1.15 + 100;
  };
  const wlsMode = buck && buck.wls_mode;
  // 只有 BPP drawload 阶段 iwls 与 iout 同域，才做一致性检查；
  // EPP+/QC 阶段 wls_icl 与 iout 属于不同控制域，禁止比较
  const iclBad = wlsMode === "bpp_drawload" && buck && buck.icl !== undefined && buck.icl !== null
    ? iclNotEffective(buck.icl, ioutNow) : false;
  // 总仲裁无线输入项：主值永远为 wireless_buck_input 的 MCA effective（仲裁结果）；
  // 执行层 ICL 作为次级信息单独展示（一致 / 下游进一步限制 / 充电暂停），
  // effective 生命周期只随会话（power_good_off 清空），work_mode 变化不使其失效
  if (chargingNow && wirelessActive && buck) {
    const workMs = buck.wls_work_mode_ms || 0;
    const iclCur = buck.icl !== null && buck.icl !== undefined
      && (!workMs || (buck.icl_ms || 0) >= workMs);
    if (mcaEff) {
      summary.push(`<span class="chip" title="wireless_buck_input MCA 仲裁结果（本会话持续状态，不受 work_mode 失效）">` +
        `无线输入仲裁<b>${fmt(mcaEff.value, 0)}</b><small>${esc(mcaEff.client)}</small></span>`);
    } else {
      summary.push(`<span class="chip" title="未捕获 wireless_buck_input effective，不以执行 ICL 反推仲裁">` +
        `无线输入仲裁<b>--</b><small>未捕获</small></span>`);
    }
    if (iclCur) {
      const rel = buck.chg_en === 0 ? "充电暂停"
        : (mcaEff && mcaEff.value === buck.icl) ? "一致"
        : (mcaEff && mcaEff.value > buck.icl) ? "下游进一步限制"
        : (mcaEff && mcaEff.value < buck.icl) ? "执行高于仲裁" : "执行层下发";
      summary.push(`<span class="chip" title="wireless loop 实际下发 ICL（执行层控制值，非仲裁结果）">` +
        `执行 ICL<b>${fmt(buck.icl, 0)}</b><small>${rel}</small></span>`);
    }
  }
  if (chargingNow) {
    const realTypeNode = (d.nodes || []).find(n => n.id === "real_type");
    const connLabel = wiredCharging ? "有线" : wirelessCharging ? "无线" : "未知";
    const rtRaw = realTypeNode && realTypeNode.value ? String(realTypeNode.value) : "";
    const rtShow = rtRaw && !/^(unknown|未连接（放电中）|未识别（充电中）)$/i.test(rtRaw) ? rtRaw : "";
    summary.push(`<span class="chip" title="battery 状态与 real_type">连接类型<b>${esc(connLabel)}</b>${rtShow ? `<small>${esc(rtShow)}</small>` : ""}</span>`);
    const battMa = d.derived && d.derived.batt_current_ma;
    // 充电生效三态：正常充电 / 停止过渡（OFF 但实测仍有电流）/ 已停止（OFF 且电流≈0）
    const ceEff = effectiveOf(topics.chg_enable);
    const ibatMag = battMa !== null && battMa !== undefined ? Math.abs(battMa) : Number.NaN;
    const ceOff = !!ceEff && ceEff.value === 0;
    const ceStopped = ceOff && Number.isFinite(ibatMag) && ibatMag <= 300;
    const ceStopping = ceOff && Number.isFinite(ibatMag) && ibatMag > 300;
    if (wiredCharging) {
      const wcp = (d.derived && d.derived.wired_cp) || {};
      const ppStaleD = d.meta && d.meta.power_path_logs_stale;
      let wPath;
      let staleD = "";
      if (wcp.state === "cp") {
        wPath = `电荷泵（有线）${wcp.ratio ? " · " + wcp.ratio + ":1" : ""}`;
        if (ppStaleD) staleD = " · 数据暂时陈旧";
      } else if (wcp.state === "buck") {
        wPath = "Buck 直充（有线）";
        if (ppStaleD) staleD = " · 数据暂时陈旧";
      } else {
        wPath = "有线功率路径待确认";
        if (ppStaleD) staleD = " · 路径日志读取异常";
      }
      summary.push(`<span class="chip" title="有线 CP 状态：电荷泵 operation mode + quickchg work_mode/ratio + cur_work_cp（内核日志符号 sc8581，设备树 SC8585）${ppStaleD ? " · 路径日志读取异常，显示上次成功状态" : ""}">当前功率路径<b>${esc(wPath)}</b><small>${staleD}</small></span>`);
      if (wcp.state === "cp") {
        // 有线 CP：Quick Charge 算法目标（1611 型 cur_max 优先，1597 型阶段值兜底），绝不用 buck_charge_curr 顶替
        if (!ceStopped) {
          const wd = wcp.cur_max && wcp.cur_max.cur_max !== undefined && wcp.cur_max.cur_max !== null
            ? wcp.cur_max : null;
          const wst = wcp.stage_cur_max && wcp.stage_cur_max.cur_max !== undefined
            && wcp.stage_cur_max.cur_max !== null ? wcp.stage_cur_max : null;
          const curAge = o => (o && o.at) ? Math.max(0, Math.round((Date.now() - o.at) / 1000)) : null;
          // 按分压比选路径限制表；single/multi 拓扑未确认前不自动二选一
          const ratio = wcp.ratio;
          const divSingle = ratio === 4 ? "div4_single"
            : ratio === 2 ? "div2_single"
            : ratio === 1 ? "div1_single" : null;
          const divMulti = ratio === 4 ? "div4_multi"
            : ratio === 2 ? "div2_multi"
            : ratio === 1 ? "div1_multi" : null;
          const limSingle = divSingle ? effectiveOf(topics[divSingle]) : null;
          const limMulti = divMulti ? effectiveOf(topics[divMulti]) : null;
          // 算法目标（原始 cur_max，不预先取 min；限制关系由下面两层表达）
          if (wd) {
            const age = curAge(wd);
            summary.push(`<span class="chip" title="mca_quick_charge_select_max_ibat 最终行 cur_max（算法目标，非实测电流，可能被路径限制压住）${wd.log_time ? " · 日志 " + esc(wd.log_time) : ""}">` +
              `Quick Charge 算法目标<b>${fmt(wd.cur_max, 0)}</b><small>quick_charge cur_max${age !== null ? " · " + age + "s前" : ""}</small></span>`);
          } else if (wst) {
            const age = curAge(wst);
            summary.push(`<span class="chip" title="仅捕获到 mca_quick_charge_select_max_ibat 阶段行，等待最终调节值${wst.log_time ? " · 日志 " + esc(wst.log_time) : ""}">` +
              `阶段算法目标<b>${fmt(wst.cur_max, 0)}</b><small>cur_stage${age !== null ? " · " + age + "s前" : ""} · 等待最终调节值</small></span>`);
          } else {
            summary.push(`<span class="chip" title="有线 CP 已确认，但尚未捕获 quick_charge cur_max">Quick Charge 算法目标<b>--</b><small>待刷新</small></span>`);
          }
          // CP 路径限制：single/multi 同值视为共同上限，异值并列展示并标拓扑待确认
          const pushLim = (lim, topic, extra) => {
            if (!lim) return;
            summary.push(`<span class="chip" title="${topic} 投票上限（CP 路径约束，非最终充电目标）">` +
              `CP ${ratio || ""}:1 路径限制<b>${fmt(lim.value, 0)}</b><small>${esc(lim.client)} · ${topic}${extra || ""}</small></span>`);
          };
          if (limSingle && limMulti) {
            if (limSingle.value === limMulti.value) {
              pushLim(limSingle, divSingle + "/" + divMulti);
            } else {
              pushLim(limSingle, divSingle, " · 拓扑待确认");
              pushLim(limMulti, divMulti, " · 拓扑待确认");
            }
          } else {
            pushLim(limSingle || limMulti, (limSingle ? divSingle : divMulti));
          }
          // 综合有效上限：仅当路径限制可确定（单一表，或双表同值）时才推算 min
          const rawTarget = wd ? wd.cur_max : (wst ? wst.cur_max : null);
          const knownLim = limSingle && limMulti
            ? (limSingle.value === limMulti.value ? limSingle : null)
            : (limSingle || limMulti);
          if (rawTarget !== null && knownLim) {
            const eff = Math.min(rawTarget, knownLim.value);
            const capped = knownLim.value < rawTarget;
            summary.push(`<span class="chip" title="min(quick_charge cur_max ${rawTarget}mA, ${knownLim.value}mA) = ${eff}mA（推算，非驱动直接输出）">` +
              `综合有效上限<b>${fmt(eff, 0)}</b><small>推算${capped ? " · 受路径限制约束" : " · cur_max 主导"}</small></span>`);
          } else if (rawTarget !== null && limSingle && limMulti && limSingle.value !== limMulti.value) {
            summary.push(`<span class="chip" title="single/multi 两张表值不同，无法确定当前生效路径限制，不做推算">综合有效上限<b>--</b><small>single/multi 拓扑待确认</small></span>`);
          } else if (rawTarget !== null && !divSingle) {
            summary.push(`<span class="chip" title="分压比未知，无法选择对应 div 限制表，不做推算">综合有效上限<b>--</b><small>分压比待确认</small></span>`);
          }
        }
        if (battMa !== null && battMa !== undefined) {
          summary.push(`<span class="chip" title="battery 实测电流（充电为正）">实际电池电流<b>${fmt(Math.abs(battMa), 0)}</b><small>battery</small></span>`);
        }
      } else {
        // 有线 Buck / 待确认：USB 输入侧 ICL + 电池侧 FCC
        addSummary("有线输入限流", effectiveOf(topics.buck_input), v => `${v}mA`);
        addSummary("电池充电上限", effectiveOf(topics.buck_charge_curr), v => `${v}mA`);
      }
    } else if (wirelessActive) {
      // 无线协议控制域（前级）与后级 Buck/CP 路径是独立维度：
      // 总仲裁只保留“当前参与限制的关键结果”：rx_iout_limit 是策略上限、
      // iout 是遥测值，均不进总仲裁（保留在详情卡/KPI）
      if (wlsMode === "epp_qc") {
        summary.push(`<span class="chip" title="RX/TX 功率协商控制（EPP+/QC），与后级 Buck/CP 路径独立">当前无线模式<b>EPP+/QC</b></span>`);
      } else if (wlsMode === "bpp_drawload") {
        summary.push(`<span class="chip" title="BPP drawload 环控制：iwls 与 iout 同域">当前无线模式<b>BPP · drawload</b></span>`);
      }
      // 无线路径：电池侧只显示 buck_charge_curr 的 MCA 仲裁结果（最终生效值）；
      // quick_wireless cur_max 不进总仲裁（保留在下方 Quick Wireless 电池电流决策卡）
      addSummary("电池充电电流", effectiveOf(topics.buck_charge_curr), v => `${v}mA`);
    }
    addSummary("充电使能", ceEff, v => (v === 1 ? "ON" : "OFF"));
    if (ceStopping) {
      summary.push(`<span class="chip" title="chg_enable 已 OFF，但实测电池电流仍 >300mA，等待驱动收敛">充电状态<b>停止中</b><small>状态收敛中</small></span>`);
    } else if (ceStopped) {
      summary.push(`<span class="chip" title="chg_enable 已 OFF 且实测电池电流已接近 0">充电状态<b>已停止</b><small>驱动 OFF</small></span>`);
    }
    if (!wirelessActive) {
      addSummary("有线快充禁用", effectiveOf(topics.quick_chg_disable), v => (v === 0 ? "未禁用" : "已禁用"));
    } else {
      addSummary("无线快充禁用", effectiveOf(topics.wls_quick_chg_disable), v => (v === 0 ? "未禁用" : "已禁用"));
    }
  }
  const th = d.thermal || {};
  if (th.scene) {
    summary.push(`<span class="chip" title="mi_thermald 当前加载的 thermal 场景">生效场景<b>${esc(th.scene)}</b></span>`);
  }
  if (th.virtual_temp !== null && th.virtual_temp !== undefined) {
    summary.push(`<span class="chip" title="VIRTUAL-SENSOR-FORMULA 加权虚拟温度（无线热控判据）">虚拟温度<b>${fmt(th.virtual_temp, 1)}</b><small>°C</small></span>`);
  }
  if (d.derived && d.derived.temp_c !== null && d.derived.temp_c !== undefined) {
    summary.push(`<span class="chip">电池温度<b>${fmt(d.derived.temp_c, 1)}</b><small>°C</small></span>`);
  }
  const summaryCard = summary.length
    ? `<div class="card wide"><h2>总仲裁结果<span class="tag">汇总</span></h2>` +
      `<div class="chips" style="justify-content:flex-start">${summary.join("")}</div></div>`
    : "";

  const order = ["wireless_buck_input", "buck_charge_curr", "chg_enable",
                 "quick_chg_disable", "wls_quick_chg_disable"];
  const sorted = order.filter(t => relevant.includes(t))
    .concat(relevant.filter(t => !order.includes(t)));
  const cards = sorted.map(t => {
    const b = topics[t];
    const rows = b.rows || [];
    const active = rows.filter(r => r.enable === 1).length;
    const chips = chipHtml(b);
    const changedText = b.changed
      ? ` · 最近变动 ${esc(b.changed.client)} ${b.changed.enabled ? "on" : "off"} → ${b.changed.value}${b.changed.time ? " @ " + b.changed.time : ""}`
      : "";
    let resultText = "";
    if (resultValid(b)) {
      resultText = `<span class="vote-result" title="驱动 effective vote is now">仲裁结果 <b>${esc(b.result.client)}</b> → ${b.result.value}${b.unit || ""}` +
        `${b.result.time ? `<small> · ${esc(b.result.time)}</small>` : ""}</span>`;
    } else if (t === "wireless_buck_input") {
      resultText = `<span class="vote-result" title="未捕获 mca_vote effective 行，不以执行层 ICL 反推仲裁">仲裁结果 <b>--</b><small>未捕获当前 effective</small></span>`;
    } else if ((b.policy === "MIN" || b.policy === "MAX") && b.unit === "mA" && rows.length) {
      const enabled = rows.filter(r => r.enable === 1);
      if (enabled.length) {
        const pick = enabled.reduce((a, r) =>
          b.policy === "MAX" ? (r.value > a.value ? r : a) : (r.value < a.value ? r : a));
        resultText = `<span class="vote-result calc" title="驱动未输出 effective 行，按已核实 policy=${b.policy} 推算">理论${b.policy} <b>${esc(pick.client)}</b> → ${pick.value}${b.unit}</span>`;
      }
    } else if (b.policy === "MIN_ASSUMED" && b.unit === "mA" && rows.length) {
      const enabled = rows.filter(r => r.enable === 1);
      if (enabled.length) {
        const pick = enabled.reduce((a, r) => (r.value < a.value ? r : a));
        resultText = `<span class="vote-result calc" title="项目假设 MIN（未从 .ko 独立核实），仅供参考，不进入总仲裁 fallback">参考推算 <b>${esc(pick.client)}</b> → ${pick.value}${b.unit}</span>`;
      }
    } else if (!resultValid(b)) {
      resultText = `<span class="vote-result calc" title="未捕获驱动 effective 行，且该主题仲裁类型未知，不做推算">未捕获驱动 effective 行</span>`;
    }
    let iclText = "";
    if (b.icl !== undefined && b.icl !== null) {
      const isEpp = b.wls_mode === "epp_qc";
      const ago = b.icl_at ? Math.max(0, Math.round((Date.now() - b.icl_at) / 1000)) : null;
      const iclOld = (b.wls_work_mode_ms || 0) > 0 && (b.icl_ms || 0) < (b.wls_work_mode_ms || 0);
      let diff = "";
      if (resultValid(b)) diff = ` · Δ${b.icl - b.result.value}mA`;
      iclText = `<span class="vote-result" title="${isEpp ? "EPP+/QC 阶段：wls_icl 是策略控制量，非当前 iout 限流" : "驱动 wireless loop 实际下发 icl（非 MCA 仲裁值）"}">${isEpp ? "wls_icl 控制量" : "实际下发 ICL"} <b>${b.icl}</b>mA` +
        `<small>${b.icl_time ? esc(b.icl_time) + " " : ""}${ago !== null ? ago + "s前" : ""}${diff}${iclOld ? " · 历史 ICL（work_mode 前）" : ""}${isEpp ? " · 非当前 iout 限流" : ""}` +
        (iclBad ? ` <span style="color:var(--amber);border:1px solid rgba(251,191,36,.5);border-radius:4px;padding:0 4px">限流未生效</span>` : "") +
        `</small></span>`;
    }
    let ioutText = "";
    if (t === "wireless_buck_input" && ioutNow !== null) {
      ioutText = `<span class="vote-result" title="wls_debug 实时输出电流">实时 iout <b>${fmt(ioutNow, 0)}</b><small>mA</small></span>`;
    }
    let modeText = "";
    if (t === "wireless_buck_input") {
      const wm = b.wls_mode;
      if (wm === "bpp_drawload") {
        modeText = `<span class="vote-result" title="BPP drawload 环控制：iwls 与 iout 同域，可做一致性比较">控制模式 <b>BPP · drawload</b></span>`;
      } else if (wm === "epp_qc") {
        modeText = `<span class="vote-result" title="EPP+/QC：wls_icl 与 iout 属于不同控制域，禁止用 ICL 判断未生效">控制模式 <b>EPP+/QC</b><small>wls_icl 与 iout 不同域</small></span>`;
      } else {
        modeText = `<span class="vote-result" title="无线控制模式未知">控制模式 <b>待确认</b></span>`;
      }
      // 生效三态 + 仲裁/执行一致性：chg_en=0 → 暂停；同域矛盾 → 疑似未生效；
      // 两者都新鲜时比较 effective 与 ICL 是否一致，执行值更低说明下游另有约束
      const effVal = resultValid(b) ? b.result.value : null;
      const iclVal = (b.icl !== null && b.icl !== undefined) ? b.icl : null;
      const iclOld = (b.wls_work_mode_ms || 0) > 0 && (b.icl_ms || 0) < (b.wls_work_mode_ms || 0);
      if (iclBad) {
        modeText += `<span class="vote-result" style="color:var(--amber)">状态 <b>疑似未生效</b><small>BPP 同域电流持续超过 ICL</small></span>`;
      } else if (b.chg_en === 0) {
        modeText += `<span class="vote-result">状态 <b>已生效 · 当前充电暂停</b><small>chg_en=0，限流非当前瓶颈</small></span>`;
      } else if (iclVal !== null && effVal !== null && !iclOld) {
        const delta = iclVal - effVal;
        const eq = delta === 0;
        modeText += `<span class="vote-result"${delta < 0 ? ' style="color:var(--amber)"' : ""}>状态 <b>${eq ? "仲裁与执行一致" : delta < 0 ? "执行值低于仲裁值" : "执行值高于仲裁值"}</b><small>仲裁 ${effVal}mA / 执行 ICL ${iclVal}mA${delta < 0 ? " · 下游另有约束" : ""}</small></span>`;
      } else if (effVal !== null) {
        modeText += `<span class="vote-result">状态 <b>已生效（仲裁）</b><small>当前路径 ICL 待捕获</small></span>`;
      } else if (iclVal !== null) {
        modeText += `<span class="vote-result">状态 <b>已下发（未捕获仲裁）</b><small>执行 ICL ${iclVal}mA，effective 待捕获</small></span>`;
      } else {
        modeText += `<span class="vote-result">状态 <b>待确认</b><small>无有效 ICL / effective</small></span>`;
      }
      const xmWls = (b.rows || []).find(r => r.client === "xm_wls");
      if (xmWls && xmWls.enable === 1) {
        modeText += `<span class="vote-result" title="xm_wls 是无线能力/适配器允许的最大输入电流票，不是当前仲裁 winner">无线能力票 xm_wls <b>${xmWls.value}</b><small>mA</small></span>`;
      }
      if (b.rx_iout_limit !== null && b.rx_iout_limit !== undefined) {
        modeText += `<span class="vote-result" title="strategy_class_wireless_op_get_rx_iout_limit 输出（驱动策略层上限，未确认对应芯片寄存器）">RX 输出电流上限 <b>${fmt(b.rx_iout_limit, 0)}</b><small>mA · driver</small></span>`;
      }
    }
    return `<div class="card"><h2>${esc(t)}<span class="tag">${active}/${rows.length} 票</span></h2>` +
      `<div class="vote-head"><small>本地时间 ${esc(b.time || "-")}${changedText}</small>${resultText}${iclText}${ioutText}${modeText}</div>` +
      `<div class="vote-chips">${chips}</div></div>`;
  }).join("");
  // JEITA 终止参数是温度档决定的静态常数，合并为一张卡
  let jeitaCard = "";
  if (hasJeita) {
    const jv = jeitaVolt && (jeitaVolt.result ? jeitaVolt.result.value :
      (jeitaVolt.rows && jeitaVolt.rows[0] ? jeitaVolt.rows[0].value : null));
    const jc = jeitaCurr && (jeitaCurr.result ? jeitaCurr.result.value :
      (jeitaCurr.rows && jeitaCurr.rows[0] ? jeitaCurr.rows[0].value : null));
    jeitaCard = `<div class="card"><h2>JEITA 终止参数<span class="tag">静态常数</span></h2>` +
      `<div class="vote-head"><small>由 JEITA 温度档决定，会话内基本不变，非实时仲裁结果</small>` +
      `<span class="vote-result">终止电压 <b>${jv === null || jv === undefined ? "-" : jv}</b><small>mV</small></span>` +
      `<span class="vote-result">终止电流 <b>${jc === null || jc === undefined ? "-" : jc}</b><small>mA</small></span></div>` +
      `<div class="vote-chips"></div></div>`;
  }
  // Quick Wireless 电池电流决策：算法聚合（非 MCA votable），仅无线路径展示
  let quickCard = "";
  const dec = buck && buck.cur_max_decision;
  if (chargingNow && wirelessActive && dec) {
    const inputs = [
      ["channel_cur", dec.channel_cur],
      ["temp_max_cur", dec.temp_max_cur],
      ["tx_adapter_max", dec.tx_adapter_max],
      ["sw_qc_ichg", dec.sw_qc_ichg],
      ["sw_thermal_ichg", dec.sw_thermal_ichg],
    ].filter(r => r[1] !== null && r[1] !== undefined);
    const minVal = inputs.length ? Math.min(...inputs.map(r => r[1])) : null;
    const chips = inputs.map(([k, v]) =>
      `<span class="vote-chip ${v === minVal ? "on" : "off"}" title="${k}${v === minVal ? "（当前瓶颈）" : ""}">` +
      `<span class="vc-dot"></span><b>${k}</b><i>${v}</i><small>mA</small></span>`).join("");
    const ibat = d.derived && d.derived.batt_current_ma;
    quickCard = `<div class="card"><h2>Quick Wireless 电池电流决策<span class="tag">算法聚合 · 非 MCA votable</span></h2>` +
      `<div class="vote-head"><small>select_max_ibat 输出${dec.log_time ? " · " + esc(dec.log_time) : ""}</small>` +
      `<span class="vote-result">cur_max:[Final] <b>${dec.final}</b><small>mA</small></span>` +
      (ibat !== null && ibat !== undefined ? `<span class="vote-result">实际 ibat <b>${fmt(ibat, 0)}</b><small>mA</small></span>` : "") +
      `</div><div class="vote-chips">${chips}</div></div>`;
  }
  const cardsShown = chargingNow ? cards : "";
  const notChargingNote = !chargingNow
    ? `<div class="card"><h2>电流投票实时表<span class="tag">未充电</span></h2>` +
      `<p class="note">当前未充电（battery STATUS ≠ Charging），投票/仲裁不生效。</p></div>`
    : "";
  el.innerHTML = summaryCard + notChargingNote + cardsShown + quickCard + jeitaCard;
}

function renderCharts(d) {
  const h = d.history || [];
  const series = [
    { id: "input_power_w", cv: "cv-input-power", label: "chart-input-power", color: "#22d3ee" },
    { id: "batt_current_ma", cv: "cv-batt-current", label: "chart-batt-current", color: "#34d399" },
    { id: "input_voltage_mv", cv: "cv-vout", label: "chart-vout", color: "#fbbf24", scale: v => v / 1000 },
    { id: "input_current_ma", cv: "cv-iout", label: "chart-iout", color: "#a78bfa" },
  ];
  const srcEl = $("chart-input-source");
  if (srcEl) {
    const src = d.derived && d.derived.input_source;
    const det = d.derived && d.derived.input_detail_source;
    const wiredWaiting = d.derived && d.derived.wired_input_waiting;
    srcEl.textContent = src === "wired"
      ? "有线 · " + srcText(det)
        + (wiredWaiting ? " · 等待策略遥测" : "")
      : src === "wireless" ? "无线 · wls_debug" : "";
  }
  series.forEach(s => {
    const latest = d.derived ? d.derived[s.id] : null;
    $(s.label).textContent = latest === null || latest === undefined ? "--" : fmt(s.scale ? s.scale(latest) : latest, s.scale ? 2 : 0);
    const vals = h.map(x => x[s.id] === null || x[s.id] === undefined ? null : (s.scale ? s.scale(x[s.id]) : x[s.id]));
    const srcs = h.map(x => x.input_detail_source || x.input_source || "none");
    drawLine($(s.cv), vals, s.color, s.label.replace("chart-", ""), srcs);
  });
}

function clearCanvas(cv) {
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
}

function drawLine(cv, values, color, name, sources) {
  clearCanvas(cv);
  const valid = values.filter(v => v !== null && v !== undefined && Number.isFinite(v));
  if (valid.length < 2) {
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#8fa3bf";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("等待数据…", cv.width / 2, cv.height / 2);
    return;
  }
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || 280;
  const cssH = cv.clientHeight || 120;
  if (cv.width !== cssW * dpr || cv.height !== cssH * dpr) {
    cv.width = cssW * dpr;
    cv.height = cssH * dpr;
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const pad = { l: 34, r: 8, t: 8, b: 20 };
  const w = cssW - pad.l - pad.r;
  const h = cssH - pad.t - pad.b;
  let min = Math.min(...valid), max = Math.max(...valid);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.08; max += span * 0.08;

  ctx.strokeStyle = "#22304d";
  ctx.fillStyle = "#8fa3bf";
  ctx.font = "10px sans-serif";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + h - (i / 3) * h;
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(pad.l + w, y);
    ctx.stroke();
    const val = min + (max - min) * (i / 3);
    ctx.textAlign = "right";
    ctx.fillText(val.toFixed(val >= 100 ? 0 : 1), pad.l - 4, y + 3);
  }
  ctx.textAlign = "left";
  ctx.fillText(name, pad.l, cssH - 4);

  const n = values.length;
  const x = i => pad.l + (i / (n - 1)) * w;
  const y = v => pad.t + h - ((v - min) / (max - min)) * h;

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  values.forEach((v, i) => {
    if (v === null || v === undefined) { started = false; return; }
    // 有线/无线来源切换时断线，不把不同测量节点连成一条连续曲线
    if (i > 0 && sources && sources[i] !== sources[i - 1]) { started = false; }
    if (!started) { ctx.moveTo(x(i), y(v)); started = true; }
    else ctx.lineTo(x(i), y(v));
  });
  ctx.stroke();

  const lastIdx = values.length - 1;
  const lv = values[lastIdx];
  if (lv !== null && lv !== undefined) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x(lastIdx), y(lv), 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderSessions(d) {
  const el = $("liveSessions");
  const list = d.sessions || [];
  if (!list.length) {
    el.innerHTML = `<div class="card"><h2>实时会话档案<span class="tag">最近日志</span></h2>` +
      `<p class="note">暂未检测到插拔/握手事件；把手机放上无线充电板后会自动生成会话时间线。</p></div>`;
    return;
  }
  const cards = list.slice().reverse().map((s, i) => {
  const meta = [
    s.uuid ? `UUID ${s.uuid}` : null,
    s.tx_adapter ? s.tx_adapter : null,
    s.fc_flag !== null && s.fc_flag !== undefined && s.fc_flag !== "" ? `fast chg ${s.fc_flag}` : null,
      s.peak_limit_ma !== null && s.peak_limit_ma !== undefined ? `峰值限流 ${s.peak_limit_ma}mA` : null,
      s.final_limit_ma !== null && s.final_limit_ma !== undefined ? `当前限流 ${s.final_limit_ma}mA` : null,
      s.opens ? `打开路径 ${s.opens} 次` : null,
      s.smartendura ? "SmartEndura 介入" : null,
    ].filter(Boolean);
    const rows = (s.events || []).map(e =>
      `<tr><td class="time">${esc(e.time)}</td><td>${esc(e.label)}</td>` +
      `<td class="mono">${esc(e.detail || "-")}</td></tr>`).join("");
    const status = s.ended ? "已结束" : "进行中";
    return `<div class="card"><h2>会话 ${list.length - i}<span class="tag">${esc(s.start)} · ${status}</span></h2>` +
      `<div class="chips" style="justify-content:flex-start;margin-bottom:10px">` +
      `${meta.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` +
      `<table><thead><tr><th>本地时间</th><th>事件</th><th>日志 / 数值</th></tr></thead>` +
      `<tbody>${rows}</tbody></table></div>`;
  }).join("");
  el.innerHTML = cards;
}

function render(data) {
  $("metaDevice").textContent = (data.meta && data.meta.adb) || "-";
  $("metaInterval").textContent = data.meta ? data.meta.interval : "3";
  $("metaVersion").textContent = (data.meta && data.meta.version) || "-";
  $("lastUpdate").textContent = data.iso || "-";
  const rawDetails = document.querySelector("#rawDetails");
  if (!rawDetails || rawDetails.open) {
    $("rawJson").textContent = JSON.stringify(data, null, 2);
  }
  $("offlineBanner").classList.remove("show");

  if (data.mode === "loading") {
    resetRenderSignatures();
    setStatus("loading", "正在连接 ADB 设备");
    const banner = $("offlineBanner");
    banner.classList.add("show");
    banner.textContent = data.error || "正在初始化采集…";
    $("kpis").innerHTML = KPI.map(k =>
      `<div class="kpi"><div class="label">${k.label}</div><div class="value empty">--</div></div>`).join("");
    $("groups").innerHTML = "";
    $("voteTopics").innerHTML = "";
    $("liveSessions").innerHTML = "";
    return;
  }

  if (data.mode !== "live" || !data.connected) {
    resetRenderSignatures();
    renderOffline(data);
    return;
  }
  setStatus("live", "实时采集");
  renderKpis(data.derived || {});
  const logsStale = data.meta && data.meta.logs_stale;
  const staleEl = $("logsStaleBadge");
  if (staleEl) staleEl.style.display = logsStale ? "" : "none";
  renderGroups(data);
  // 每次快速刷新都重绘投票区，让“Ns前”等相对时间持续增长
  renderVoters(data);
  renderCharts(data);
  const sessionsJson = JSON.stringify(data.sessions || []);
  if (sessionsJson !== lastSessionsJson) {
    lastSessionsJson = sessionsJson;
    renderSessions(data);
  }
}

function resetRenderSignatures() {
  lastGroupsJson = "";
  lastVotersJson = "";
  lastSessionsJson = "";
  lastGroupsStruct = "";
}

let lastMeta = {};

async function load() {
  lastFetchAt = Date.now();
  try {
    const res = await fetch("/api/data", {
      cache: "no-store",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    if (data.meta) {
      lastMeta = data.meta;
      if (data.meta.fast_interval) {
        pollMs = Math.max(1000, data.meta.fast_interval * 1000);
      }
    }
    render(data);
  } catch (err) {
    console.error("load failed:", err);
    setStatus("offline", "服务连接失败");
    const banner = $("offlineBanner");
    banner.classList.add("show");
    banner.textContent = "无法获取数据：" + err.message +
      "。请确认 server.py 正在运行并且 ADB 设备在线。";
  } finally {
    clearTimeout(timer);
    timer = setTimeout(load, pollMs);
  }
}

setInterval(() => {
  if (!lastFetchAt) return;
  const remain = Math.max(0, (lastFetchAt + pollMs - Date.now()) / 1000);
  const fc = $("fastCountdown");
  if (fc) fc.textContent = remain.toFixed(1) + "s";
  const logsInterval = (lastMeta.logs_interval || 10) * 1000;
  const logsRemain = Math.max(0,
    (lastMeta.logs_updated_at || Date.now()) + logsInterval - Date.now());
  const lc = $("logsCountdown");
  if (lc) lc.textContent = (logsRemain / 1000).toFixed(1) + "s";
}, 250);

load();
</script>
